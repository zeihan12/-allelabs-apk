name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Siapkan file APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AlleLabs.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlleLabs-APK
          path: AlleLabs.apk

      - name: Publikasikan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AlleLabs.apk \
            --title "Alle Labs Now Playing (APK terbaru)" \
            --notes "Unduh AlleLabs.apk di bawah, lalu instal di HP Android." \
            --latest
